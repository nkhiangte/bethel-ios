name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Our cloud Mac

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install CocoaPods Dependencies
      run: |
        cd src
        pod install

    - name: Validate Xcode Build
      run: |
        cd src
        # This compiles the app to ensure the code works!
        # Note: CODE_SIGNING_ALLOWED=NO allows it to build without an Apple Developer account.
        xcodebuild -workspace Bethel.xcworkspace -scheme "Bethel" -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
