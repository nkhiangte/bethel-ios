- name: Configure Podfile
      run: |
        cd src
        # This overwrites the Podfile to ensure we have one single, unified post_install hook
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_frameworks!

        target 'Bethel' do
          pod 'FirebaseCore'
          pod 'GoogleDataTransport'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            # Existing post_install logic often goes here
            target.build_configurations.each do |config|
              # Our injected Swift experimental flags
              config.build_settings['OTHER_SWIFT_FLAGS'] = '-enable-experimental-feature AccessLevelOnImport -enable-experimental-feature SendingArgsAndResults'
            end
          end
        end
        EOF
