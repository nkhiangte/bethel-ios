name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Upgrading to macos-15 defaults to Xcode 16, solving the Swift 6 issue natively!

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure Podfile
      run: |
        cd src
        # A clean Podfile. No experimental flags needed anymore!
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_frameworks!

        target 'Bethel' do
          pod 'FirebaseCore'
          pod 'GoogleDataTransport'
        end
        EOF

    - name: Install CocoaPods Dependencies
      run: |
        cd src
        pod install

    - name: Validate Xcode Build
      run: |
        cd src
        xcodebuild build \
          -workspace Bethel.xcworkspace \
          -scheme "Bethel" \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
